server:
  port: 8081

#eureka注册中心
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: front
  # 允许循环依赖，解决PageHelper兼容性问题
  main:
    allow-circular-references: true

  #mysql8
  datasource:
    username: root
    password: 654321
    # For local dev: allow public key retrieval to avoid authentication error with some MySQL setups
    url: jdbc:mysql://localhost:3306/gp?characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver

  #redis
  redis:
    host: localhost
    port: 6379
    password: 654321

#mybatis
mybatis:
  mapper-locations: classpath:com/fanshuaiko/front/dao/mapper/*.xml
  type-aliases-package: com.fanshuaiko.front.entity

# 健康检查配置：禁用数据库和 Redis 健康检查，避免 DataSourceHealthIndicator 影响启动
management:
  health:
    defaults:
      enabled: true
    db:
      enabled: false
    redis:
      enabled: false
