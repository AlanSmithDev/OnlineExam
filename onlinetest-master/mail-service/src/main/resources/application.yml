spring:
  mail:
    #QQ邮件服务地址
    host: smtp.qq.com
    port: 465
    #用户名
    username: 2916304767@qq.com
    #密码（授权码）
    password: hjfnrlzluujsdhab
    #默认编码utf-8
    default-encoding: UTF-8
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true

  # 本应用的名称
  application:
    name: mail-service

  # 禁用数据源和 Redis 自动配置（邮件服务无需DB）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration

server:
  port: 8089

# eureka注册中心
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# 健康检查配置
management:
  health:
    redis:
      enabled: false
